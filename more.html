<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikimiuki | More</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="more-content.css">
</head>
<body>
    <header class="custom-header"></header>

    <main class="main-content">
        <div class="grid-more">
            
            <div class="more-slot">
                <div class="card-container">
                    <img src="img/youtube-iki.jpg" alt="YouTube - Iki" class="more-thumb">
                    <div class="more-info">
                        <h3>Iki (Youtube - Spanish Channel)</h3>
                        <p>Humorous narrative gaming videos</p>
                    </div>
                    <a href="https://www.youtube.com/@IKIMEN" target="_blank" rel="noopener" class="overlay-link"></a>
                </div>
            </div>

            <div class="more-slot">
                <div class="card-container">
                    <img src="img/youtube-music.jpg" alt="YouTube - Music" class="more-thumb">
                    <div class="more-info">
                        <h3>Iki Capitan - Music</h3>
                        <p>Official music videos, visualizers and audio tracks</p>
                    </div>
                    <a href="https://www.youtube.com/@TuCanalDeMusica" target="_blank" rel="noopener" class="overlay-link"></a>
                </div>
            </div>

        </div> </main> <footer></footer>

    <script src="js/layout.js"></script>
</body>
</html>
