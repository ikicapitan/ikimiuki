<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iki Capitan - Music</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="music-content.css">
</head>
<body>
    <header class="custom-header"></header>

    <main class="main-content">
        <div class="grid-music">
            <div class="music-slot featured">
                <div class="card-container">
                    <img src="img/music-1.jpg" alt="Rocking Horse Glittered" class="album-thumb">
                    <div class="music-info">
                        <h3>ROCKING HORSE GLITTERED</h3>
                        <p>NEW ALBUM - IKI GENRE</p>
                    </div>
                    <a href="rockinghorseglittered.html" class="overlay-link"></a>
                </div>
            </div>

            <div class="music-row">
                <div class="music-slot">
                    <div class="card-container">
                        <img src="img/music-2.jpg" alt="SSENDAS - THE MAGIC" class="album-thumb">
                        <div class="music-info">
                            <h3>SSENDAS</h3>
                            <p>THE MAGIC (2019)</p>
                        </div>
                        <a href="the-magic.html" class="overlay-link"></a>
                    </div>
                </div>
                <div class="music-slot">
                    <div class="card-container">
                        <img src="img/music-3.jpg" alt="SSENDAS - IN NOWHERE" class="album-thumb">
                        <div class="music-info">
                            <h3>SSENDAS</h3>
                            <p>IN NOWHERE (2017)</p>
                        </div>
                        <a href="in-nowhere.html" class="overlay-link"></a>
                    </div>
                </div>
            </div> 
        </div>
    </main>

    <footer></footer>
    <script src="js/layout.js"></script>
</body>
</html>
