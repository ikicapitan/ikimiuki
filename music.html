<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music | Iki</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="music-content.css">
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixi-spine/all-3.8@4.x/dist/pixi-spine-3.8.js"></script>
</head>
<body>
    <header class="custom-header"></header>

    <main>
        <div class="grid-music">
            <div class="music-slot featured">
                <div class="card-container" id="canvas-reel">
                    <div class="tv-lines"></div>
                    <div class="info-reel">
                        <h2 id="reel-title">Cargando...</h2>
                        <p id="reel-subtitle">Preparando el escenario</p>
                    </div>
                    <a href="#" id="reel-link" class="overlay-link"></a>
                </div>
            </div>

            <div class="music-row">
                <div class="music-slot">
                    <div class="card-container">
                        <a href="https://www.youtube.com/watch?v=tvoj2fgu8Uc&list=PLIKkFze2X6GtoR0l1kRti-o-45PVRlGkO&pp=sAgC" class="overlay-link">
                            <img src="img/music-2.jpg" alt="SSENDAS - THE MAGIC" class="album-thumb">
                            <div class="music-info">
                                <h3>SSENDAS</h3>
                                <p>THE MAGIC (2019)</p>
                            </div>
                        </a>
                    </div>
                </div>
                <div class="music-slot">
                    <div class="card-container">
                        <a href="https://www.youtube.com/watch?v=Lrs5cDDGZsM&list=PLIKkFze2X6GvWF7IEWeyGXufvCTGo545K&pp=sAgC" class="overlay-link">
                            <img src="img/music-3.jpg" alt="SSENDAS - IN NOWHERE" class="album-thumb">
                            <div class="music-info">
                                <h3>SSENDAS</h3>
                                <p>IN NOWHERE (2017)</p>
                            </div>
                        </a>
                    </div>
                </div>
            </div> 
        </div>
    </main>

    <footer></footer>

    <script src="js/layout.js"></script>
    <script src="js/music-pixi.js"></script>
</body>
</html>
