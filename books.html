<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ikimiuki | Books</title>
    <meta name="description" content="Discover deeply artistic worlds hidden within our novels and children's stories.">
    <meta property="og:image" content="https://ikimiuki.com/img/btn-books.png">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="books-content.css">
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
</head>
<body>
    <header class="custom-header"></header>

    <main>
        <div class="grid-books">
            <div class="book-slot featured">
                <div class="card-container" id="canvas-reel">
                    <div class="tv-lines"></div>
                    <div class="info-reel">
                        <h2 id="reel-title">Cargando...</h2>
                        <p id="reel-subtitle">Explorando historias</p>
                    </div>
                    <a href="#" id="reel-link" class="overlay-link"></a>
                </div>
            </div>

            <div class="books-row">
                <div class="book-slot">
                    <div class="card-container">
                        <img src="img/book-1.jpg" alt="Obra 1" class="book-thumb">
                        <div class="book-info">
                            <h3>Título de Libro</h3>
                            <p>Descripción breve (2025)</p>
                        </div>
                    </div>
                </div>
                <div class="book-slot">
                    <div class="card-container">
                        <img src="img/book-2.jpg" alt="Obra 2" class="book-thumb">
                        <div class="book-info">
                            <h3>Otra Historia</h3>
                            <p>Relato corto (2024)</p>
                        </div>
                    </div>
                </div>
            </div> 
        </div>
    </main>

    <footer></footer>

    <script src="js/layout.js"></script>
    <script src="js/books-pixi.js"></script>
</body>
</html>
