<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ikimiuki | Books</title>
    <meta name="description" content="Discover deeply artistic worlds hidden within our novels and children's stories.">
    <meta property="og:image" content="https://ikimiuki.com/img/book-1.jpg">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="books-content.css">
</head>
<body>
    <header class="custom-header"></header>

    <main class="main-content">
        <div class="grid-books">
            <div class="book-slot featured">
                <div class="card-container">
                    <img src="img/book-proxy.png" alt="Featured Book" class="book-thumb">
                    <div class="book-info">
                        <h3>NEW NOVEL</h3>
                        <p>COMING SOON</p>
                    </div>
                </div>
            </div>

            <div class="books-row">
                <div class="book-slot">
                    <div class="card-container">
                        <img src="img/book-proxy.png" alt="Obra 1" class="book-thumb">
                        <div class="book-info">
                            <h3>COMING SOON</h3>
                            <p>Children's stories</p>
                        </div>
                    </div>
                </div>
                <div class="book-slot">
                    <div class="card-container">
                        <img src="img/book-proxy.png" alt="Obra 2" class="book-thumb">
                        <div class="book-info">
                            <h3>COMING SOON</h3>
                            <p>Children's stories</p>
                        </div>
                    </div>
                </div>
            </div> 
        </div>
    </main>

    <footer></footer>

    <script src="js/layout.js"></script>
</body>
</html>
